    <text x="80" y="604" font-size="20" fill="#8B98A9">三件合计 <tspan font-family="Consolas, Microsoft YaHei, monospace" fill="#E6EDF3">¥11510 → ¥6105</tspan>，<tspan fill="#E5484D" font-weight="bold">−47%</tspan>。看起来我躲过了一劫……</text>
