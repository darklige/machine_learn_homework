  <g id="point-2" data-pptx-bounds="56 290 640 130">
    <text x="56" y="336" font-family="Consolas, Microsoft YaHei, monospace" font-size="32" font-weight="bold" fill="#F5A623">02</text>
    <text x="116" y="336" font-size="28" font-weight="bold" fill="#E6EDF3">比特币、黄金几乎无关，<tspan fill="#E5484D">V 社说了算</tspan></text>
    <text x="116" y="374" font-size="20" fill="#E6EDF3">2025 年“5 合 1”更新后一路下跌；价格由开发者<tspan x="116" dy="28">决定，极易被操盘</tspan></text>
  </g>
  <g id="point-3" data-pptx-bounds="56 430 640 110">
