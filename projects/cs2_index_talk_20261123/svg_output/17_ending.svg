  <g id="point-1" data-pptx-bounds="56 150 640 130">
    <text x="56" y="196" font-family="Consolas, Microsoft YaHei, monospace" font-size="32" font-weight="bold" fill="#F5A623">01</text>
    <text x="116" y="196" font-size="28" font-weight="bold" fill="#E6EDF3">模型有一定精度，但优势不大</text>
    <text x="116" y="234" font-size="20" fill="#E6EDF3">1 天预测比持平低 15.7% 且显著；近两年整体<tspan x="116" dy="28">只领先 4%~10%，大盘多数时候接近随机游走</tspan></text>
