      <use data-icon="tabler-filled/circle-x" x="1072" y="438" width="24" height="24" fill="#E5484D"/><text x="1104" y="457" fill="#E5484D">未达标</text>
      <use data-icon="tabler-filled/circle-check" x="1072" y="516" width="24" height="24" fill="#3FB950"/><text x="1104" y="535" fill="#3FB950">达标</text>
      <use data-icon="tabler-filled/circle-check" x="1072" y="594" width="24" height="24" fill="#3FB950"/><text x="1104" y="613" fill="#3FB950">达标</text>
