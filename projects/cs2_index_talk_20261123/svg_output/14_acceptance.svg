    <text x="56" y="116" font-size="44" font-weight="bold" fill="#E6EDF3">对账：说到的做到了几项</text>
  </g>
  <g id="acceptance" data-pptx-bounds="56 140 1168 512">
    <rect x="56" y="140" width="1168" height="44" fill="#1C232D"/>
    <g font-size="20" fill="#8B98A9">
      <text x="72" y="170">计划书目标</text>
      <text x="452" y="170">结果</text>
      <text x="1072" y="170">状态</text>
    </g>
    <g stroke="#2D3742" stroke-width="1">
      <line x1="56" y1="184" x2="1224" y2="184"/>
      <line x1="56" y1="262" x2="1224" y2="262"/>
      <line x1="56" y1="340" x2="1224" y2="340"/>
      <line x1="56" y1="418" x2="1224" y2="418"/>
      <line x1="56" y1="496" x2="1224" y2="496"/>
      <line x1="56" y1="574" x2="1224" y2="574"/>
      <line x1="56" y1="652" x2="1224" y2="652"/>
    </g>
    <g font-size="20" fill="#E6EDF3">
      <text x="72" y="216">数据：≥ 200 件饰品、≥ 2 年<tspan x="72" dy="28">缺失率 &lt; 5%</tspan></text>
      <text x="452" y="216">改为大盘指数单序列，1095 天（3 年）<tspan x="452" dy="28" fill="#8B98A9">单品数量因题目调整不适用</tspan></text>
      <text x="72" y="294">7 天 MAPE 比持平降低 ≥ 15%<tspan x="72" dy="28">且通过 DM 检验</tspan></text>
      <text x="452" y="294">KNN 降低 30.5%，DM p=0.001<tspan x="452" dy="28" fill="#8B98A9">主要来自单边下跌；近两年整体只降 6.2%</tspan></text>
      <text x="72" y="372">分类准确率 ≥ 60%<tspan x="72" dy="28">Macro-F1 ≥ 0.55</tspan></text>
      <text x="452" y="372">随机森林 66.4% / 0.292<tspan x="452" dy="28" fill="#8B98A9">准确率不如“永远预测跌”的 73.8%</tspan></text>
      <text x="72" y="450">80% 区间覆盖率<tspan x="72" dy="28">75% ~ 85%</tspan></text>
      <text x="452" y="450">校准后 88.4% / 92.6% / 91.3%<tspan x="452" dy="28" fill="#8B98A9">偏宽；未校准 87.1% / 74.5% / 62.7%</tspan></text>
      <text x="72" y="528">SHAP 分析，≥ 3 条<tspan x="72" dy="28">有数据支撑的规律</tspan></text>
      <text x="452" y="528">4 条规律，另辨析竞品特征的虚假重要性</text>
      <text x="72" y="606">可交互演示系统</text>
      <text x="452" y="606">Streamlit：预测、区间、SHAP、排行榜</text>
    </g>
