<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <clipPath id="clip-phone"><polygon points="72,156 332,156 332,536 72,536"/></clipPath>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#12161C"/>
  <g id="hud-frame" data-pptx-role="decoration" data-pptx-bounds="20 20 1240 680" stroke="#F5A623" stroke-opacity="0.6" stroke-width="2">
    <line x1="24" y1="24" x2="60" y2="24"/><line x1="24" y1="24" x2="24" y2="60"/>
    <line x1="1220" y1="24" x2="1256" y2="24"/><line x1="1256" y1="24" x2="1256" y2="60"/>
    <line x1="24" y1="696" x2="60" y2="696"/><line x1="24" y1="660" x2="24" y2="696"/>
    <line x1="1220" y1="696" x2="1256" y2="696"/><line x1="1256" y1="660" x2="1256" y2="696"/>
  </g>
  <g id="header" data-pptx-bounds="56 36 1168 100">
    <g font-family="Consolas, Microsoft YaHei, monospace" font-size="20">
      <text x="56" y="62" fill="#F5A623" font-weight="bold">ROUND 16 · 赛后复盘：写给想“理财”的你</text>
      <text x="1224" y="62" fill="#8B98A9" text-anchor="end">16 / 17</text>
    </g>
    <text x="56" y="116" font-size="44" font-weight="bold" fill="#E6EDF3">钱，和<tspan fill="#E5484D">欢乐豆</tspan>一样跌</text>
  </g>
  <g id="phone-drop" data-pptx-bounds="56 140 300 470">
    <rect x="56" y="140" width="292" height="412" rx="16" fill="#1C232D" stroke="#2D3742" stroke-width="2"/>
    <image href="../images/meme_huanledou_drop.png" x="72" y="95.6" width="260" height="565.3" preserveAspectRatio="xMidYMid meet" clip-path="url(#clip-phone)"/>
    <text x="56" y="592" font-size="20" fill="#8B98A9">无涂装蝴蝶刀 · 近 30 天</text>
  </g>
  <g id="drop-number" data-pptx-bounds="380 150 300 300">
    <text x="380" y="196" font-family="Consolas, Microsoft YaHei, monospace" font-size="28" fill="#8B98A9">≈¥7200 → ≈¥5400</text>
    <text x="380" y="330" font-family="Consolas, Microsoft YaHei, monospace" font-size="120" font-weight="bold" fill="#E5484D">−25%</text>
    <text x="380" y="386" font-size="28" fill="#E6EDF3">一个月，四分之一</text>
    <text x="380" y="426" font-size="20" fill="#8B98A9">比欢乐豆输得还快</text>
  </g>
  <g id="kurumi" data-pptx-bounds="712 140 512 330">
    <rect x="712" y="140" width="512" height="290" fill="#1C232D"/>
    <image href="../images/meme_kurumi.png" x="712" y="140" width="512" height="288" preserveAspectRatio="xMidYMid meet"/>
    <text x="712" y="462" font-size="20" fill="#8B98A9">久留美：“老实赚钱，很枯燥吧？”</text>
  </g>
  <g id="reply" data-pptx-bounds="712 480 512 130">
    <text x="712" y="524" font-size="28" fill="#E6EDF3">我们的回答：<tspan fill="#F5A623" font-weight="bold">枯燥，但踏实。</tspan></text>
    <text x="712" y="574" font-size="28" fill="#E6EDF3">不要相信暴富。</text>
  </g>
  <g id="quote" data-pptx-bounds="56 610 1168 50">
    <rect x="56" y="616" width="4" height="40" fill="#E5484D"/>
    <text x="76" y="646" font-size="28" fill="#E6EDF3">大学生名言：“事到如今，<tspan fill="#E5484D" font-weight="bold">最对不起的就是父母</tspan>。”</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="56 664 1168 42">
    <line x1="56" y1="672" x2="1224" y2="672" stroke="#2D3742" stroke-width="1"/>
    <text x="56" y="696" font-size="16" fill="#8B98A9">价格读自悠悠有品 30 天走势截图坐标，为近似值；梗图：《FX 战士久留美》</text>
  </g>
